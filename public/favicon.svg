<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark Squircle App Container -->
  <rect width="32" height="32" rx="7.5" fill="#0d0e12" stroke="#2a2c35" stroke-width="0.75" />
  
  <g fill="#ffffff">
    <!-- Head -->
    <circle cx="16" cy="11.2" r="1.8" />
    <!-- Thorax -->
    <circle cx="16" cy="14.6" r="2.2" />
    <!-- Abdomen -->
    <ellipse cx="16" cy="19.8" rx="3.4" ry="4.3" />
  </g>

  <!-- 8 Symmetrical Legs: 4-Up, 4-Down Arches -->
  <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Left Legs -->
    <path d="M 14.4 13.4 C 11.8 10.8 11.8 6.7 14.1 4.5" />
    <path d="M 13.8 14.4 C 9.9 11.5 8.6 8.0 9.9 5.8" />
    <!-- Bottom Left Legs -->
    <path d="M 13.8 15.7 C 9.3 17.6 8.6 22.1 9.9 25.6" />
    <path d="M 14.4 17.3 C 11.5 20.2 11.5 24.3 14.1 27.5" />

    <!-- Top Right Legs -->
    <path d="M 17.6 13.4 C 20.2 10.8 20.2 6.7 17.9 4.5" />
    <path d="M 18.2 14.4 C 22.1 11.5 23.4 8.0 22.1 5.8" />
    <!-- Bottom Right Legs -->
    <path d="M 18.2 15.7 C 22.7 17.6 23.4 22.1 22.1 25.6" />
    <path d="M 17.6 17.3 C 20.5 20.2 20.5 24.3 17.9 27.5" />
  </g>
</svg>
